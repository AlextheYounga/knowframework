[workspace]
members = [
    "crates/know-core",
    "crates/know-ontology",
    "crates/know-lexicon",
    "crates/know-reasoner",
    "crates/know-admission",
    "crates/know-owl",
    "crates/know-cli",
    "crates/know-test-support",
    "tests/cleancode",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
know-core        = { path = "crates/know-core" }
know-ontology    = { path = "crates/know-ontology" }
know-lexicon     = { path = "crates/know-lexicon" }
know-reasoner    = { path = "crates/know-reasoner" }
know-admission   = { path = "crates/know-admission" }
know-owl         = { path = "crates/know-owl" }
know-test-support = { path = "crates/know-test-support" }

serde    = { version = "1", features = ["derive"] }
ron      = "0.8"
thiserror = "2"
clap     = { version = "4", features = ["derive"] }
syn      = { version = "2", features = ["full", "extra-traits", "visit"] }

[workspace.lints]

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
similar_names = "warn"
many_single_char_names = "warn"
module_name_repetitions = "warn"
enum_variant_names = "warn"
struct_field_names = "warn"
disallowed_names = "deny"
wildcard_imports = "warn"
module_inception = "warn"
cognitive_complexity = "warn"
too_many_arguments = "deny"
fn_params_excessive_bools = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
checked_conversions = "warn"
absolute_paths = "warn"
allow_attributes = "deny"
redundant_clone = "warn"
implicit_clone = "warn"
semicolon_if_nothing_returned = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"


